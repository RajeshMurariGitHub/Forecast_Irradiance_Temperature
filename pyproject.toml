[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-irradiance-temperature"
version = "1.0.0"
description = "End-to-end pipeline for forecasting solar irradiance and temperature"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Data Science Team"},
]
license = {text = "MIT"}
keywords = ["solar", "forecasting", "irradiance", "temperature", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "pvlib>=0.10.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.0",
]
ml = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "statsmodels>=0.14.0",
]
dl = [
    "tensorflow>=2.13.0",
    "torch>=2.0.0",
    "keras>=2.13.0",
]
viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "altair>=5.1.0",
]
all = [
    "forecast-irradiance-temperature[dev,ml,dl,viz]",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["scripts"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "pvlib.*",
    "tensorflow.*",
    "torch.*",
    "keras.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --cov=scripts --cov-report=term-missing"
filterwarnings = [
    # starlette TestClient <-> httpx version drift; not our code
    "ignore:Using `httpx` with `starlette.testclient`:Warning",
]

[tool.pylint.messages_control]
disable = [
    "C0330",
    "C0326",
    "R0913",
    "R0914",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "x", "y", "df", "ax"]
