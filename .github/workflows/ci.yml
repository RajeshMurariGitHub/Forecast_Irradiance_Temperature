name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint (pylint)
        # Repo is at 10/10; the floor leaves a small margin for minor additions.
        run: pylint --fail-under=9.5 scripts api dashboard

      - name: Type check (pyright)
        run: pyright --project pyrightconfig.json

      - name: Tests (pytest)
        run: |
          set -o pipefail
          python -m pytest -q -rA --tb=short --no-header \
            --cov=scripts --cov=api --cov-report=term-missing 2>&1 | tee pytest-output.txt

      - name: Surface pytest failures as annotations
        if: failure()
        run: |
          {
            echo '## pytest'
            echo '```'
            tail -c 15000 pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(FAILED|ERROR|E |tests/|_{5,} )' pytest-output.txt | head -60 \
            | while IFS= read -r line; do echo "::error::${line}"; done
