name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint (pylint)
        # Maintained modules score ~10/10; the floor guards against large
        # regressions while the legacy utils modules are cleaned up.
        run: pylint --fail-under=8.0 scripts api dashboard

      - name: Type check (pyright)
        run: pyright --project pyrightconfig.json

      - name: Tests (pytest)
        run: pytest -q --cov=scripts --cov=api --cov-report=term-missing
