services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: solar-forecast-api:latest
    container_name: solar-forecast-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: solar-forecast-dashboard:latest
    container_name: solar-forecast-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
